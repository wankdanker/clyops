packages:
  - packages/js
  - packages/schema
  - packages/tools
  - packages/jobs
  - apps/mcp
  - apps/doc
  - apps/api
  - apps/runner
  - apps/web

# Resolve matching workspace dependencies locally, retaining exact versions
# in manifests so release tarballs also work outside this workspace.
linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild
