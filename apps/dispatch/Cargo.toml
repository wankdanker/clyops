[package]
name = "clyops-dispatch"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Turn a directory of clyops tools into one command with nested subcommands, help and shell completion."
license = "MIT"
repository = "https://github.com/wankdanker/clyops"
keywords = ["cli", "dispatcher", "subcommands", "completion"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "clyops-dispatch"
path = "src/main.rs"

[dependencies]
clyops = { path = "../../packages/rust", version = "0.2.0" }
serde_json = "1"
