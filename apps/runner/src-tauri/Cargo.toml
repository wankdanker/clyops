[package]
name = "clyops-runner"
version = "0.12.2"
description = "Desktop UI that builds forms for clyops tools and runs them"
license = "MIT"
repository = "https://github.com/wankdanker/clyops"
publish = false
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4"
tauri-plugin-clipboard-manager = "2.3.2"
# Fetching the URL schemas json:SCHEMA inputs reference (#51): rustls with ring, which builds
# without cmake on every platform.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
