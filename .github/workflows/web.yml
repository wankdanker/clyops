name: Web runner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter clyops-web typecheck
      - run: pnpm --filter clyops-web exec playwright install --with-deps chromium
      - run: pnpm test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-runner-test-results
          path: apps/web/test-results
