name: Publish

# Publishes a released version to the package registries. Run it by hand after
# the GitHub release exists (Actions → Publish → Run workflow).
#
# Needs: npm trusted publishing configured for every public JS/TS package,
# secret CARGO_REGISTRY_TOKEN (crates.io), secret RUBYGEMS_API_KEY (rubygems.org),
# and PyPI trusted publishing configured for this workflow with environment
# "pypi". The Go module needs no publishing (the release tags it), and the Java
# jar is attached to the GitHub release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
      npm:
        description: Publish to npm
        type: boolean
        default: true
      pypi:
        description: Publish to PyPI
        type: boolean
        default: true
      crates:
        description: Publish to crates.io
        type: boolean
        default: true
      rubygems:
        description: Publish to RubyGems
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  npm:
    if: inputs.npm
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      # Trusted publishing requires npm >=11.5.1; don't rely on bundled npm.
      - run: pnpm add --global npm@11
      - name: Show publishing tool versions
        run: |
          node --version
          pnpm --version
          pnpm exec "$PNPM_HOME/npm" --version
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm test
      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/version.py --tag "$RELEASE_TAG"
      # pnpm 10 packs and orders the workspaces, then delegates registry upload
      # to npm 11 for OIDC. Checkout is detached at the validated release tag.
      - name: Publish public workspaces
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm --filter '!clyops-runner' -r publish --no-git-checks --access public --npm-path "$PNPM_HOME/npm"

  pypi:
    if: inputs.pypi
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install build && python -m build packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: packages/python/dist }

  crates:
    if: inputs.crates
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: dtolnay/rust-toolchain@stable
      - name: clyops
        working-directory: packages/rust
        run: cargo publish
      # Depends on the clyops crate just published; cargo publish waits for the index.
      - name: clyops-dispatch
        working-directory: apps/dispatch
        run: cargo publish --locked

  rubygems:
    if: inputs.rubygems
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/ruby } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - run: ruby -w test/test_clyops.rb && gem build clyops.gemspec
      - run: gem push clyops-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
