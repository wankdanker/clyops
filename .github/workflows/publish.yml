name: Publish

# Publishes a released version to the package registries. Run it by hand after
# the GitHub release exists (Actions → Publish → Run workflow).
#
# Needs: secret NPM_TOKEN (npm), secret CARGO_REGISTRY_TOKEN (crates.io), and
# PyPI trusted publishing configured for this workflow with environment "pypi".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
      npm:
        description: Publish to npm
        type: boolean
        default: true
      pypi:
        description: Publish to PyPI
        type: boolean
        default: true
      crates:
        description: Publish to crates.io
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  npm:
    if: inputs.npm
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    defaults: { run: { working-directory: packages/js } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm ci && npm run build && npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: inputs.pypi
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install build && python -m build packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: packages/python/dist }

  crates:
    if: inputs.crates
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/rust } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
