name: Runner

# The desktop app is a consumer of the clyops schema: it rebuilds when the app
# or the spec changes, not on every library change.
on:
  push:
    branches: [main]
    paths: ["apps/runner/**", "spec/**", "packages/c/**", ".github/workflows/runner.yml"]
  pull_request:
    paths: ["apps/runner/**", "spec/**", "packages/c/**", ".github/workflows/runner.yml"]
  workflow_dispatch:

concurrency:
  group: runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/runner/src-tauri }
      - run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Frontend typecheck and build
        working-directory: apps/runner
        run: npm ci && npm run build
      - name: Build the C demo the runner tests load
        run: make -C packages/c
      - name: Backend tests
        working-directory: apps/runner/src-tauri
        run: cargo test --locked
