name: Release

# Pushing a tag vX.Y.Z builds every artifact and attaches them all to one
# GitHub release. The tag must match the monorepo version (tools/version.py).
#
# Running it by hand (Actions → Release → Run workflow), or a push to main that
# changes the release or installer configuration, is a dry run: everything is
# built and kept as workflow artifacts, nothing is released.
#
# Publishing to npm, PyPI and crates.io is a separate, manual step: publish.yml.

on:
  push:
    tags: ["v*"]
    # Path filters apply to branch pushes only; tag pushes always run.
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "apps/runner/package.json"
      - "apps/runner/src-tauri/tauri.conf.json"
      - "apps/runner/src-tauri/Cargo.toml"
      - "apps/runner/src-tauri/icons/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        name: Version matches the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$(python3 tools/version.py --tag "$GITHUB_REF_NAME")
          else
            version=$(python3 tools/version.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish
      - run: pip install jsonschema && python3 tools/check-schema.py
      - run: make build test conformance completions

  # Desktop installers for the runner app.
  runner:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the Linux packages compatible with older glibc.
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: macos-universal, target: universal-apple-darwin }
          - { os: windows-latest, platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/runner/src-tauri, key: "${{ matrix.platform }}" }
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build installers
        working-directory: apps/runner
        run: |
          npm ci
          npx tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Collect
        run: |
          bundle=apps/runner/src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle
          mkdir -p out
          shopt -s nullglob
          for f in "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage \
                   "$bundle"/dmg/*.dmg "$bundle"/msi/*.msi "$bundle"/nsis/*.exe; do
            cp "$f" out/
          done
          ls -l out
          [ -n "$(ls out)" ] || { echo "no installers were produced"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  # Prebuilt static library + header. The C package needs POSIX (regex.h,
  # getline), so there is no native Windows build.
  c:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: macos-universal }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: make -C packages/c test
      - if: runner.os == 'macOS'
        name: Universal library (arm64 + x86_64)
        working-directory: packages/c
        run: |
          for arch in arm64 x86_64; do
            make "build-$arch/libclyops.a" BUILD="build-$arch" CFLAGS="-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -arch $arch"
          done
          lipo -create build-arm64/libclyops.a build-x86_64/libclyops.a -output build/libclyops.a
          lipo -info build/libclyops.a
      - name: Package
        run: |
          name="libclyops-$VERSION-${{ matrix.platform }}"
          mkdir -p "out/$name/include" "out/$name/lib"
          cp packages/c/include/clyops.h "out/$name/include/"
          cp packages/c/build/libclyops.a "out/$name/lib/"
          cp LICENSE packages/c/README.md "out/$name/"
          tar -czf "out/$name.tar.gz" -C out "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: c-${{ matrix.platform }}
          path: out/*.tar.gz
          if-no-files-found: error

  # Platform-independent packages: what the registries get, attached to the
  # release as well.
  packages:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p out
      - name: npm package
        working-directory: packages/js
        run: npm ci && npm run build && npm pack --pack-destination ../../out
      - name: Python wheel and sdist
        run: pip install build && python -m build packages/python --outdir out
      - name: Rust crate
        working-directory: packages/rust
        run: cargo package && cp "target/package/clyops-$VERSION.crate" ../../out/
      - name: Bash library and C sources
        run: |
          cp packages/bash/clyops.sh out/clyops.sh
          tar -czf "out/libclyops-$VERSION-src.tar.gz" -C packages \
            --transform "s,^c,libclyops-$VERSION," c/include c/src c/Makefile c/CMakeLists.txt c/README.md
      - run: ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*
          if-no-files-found: error

  release:
    needs: [verify, runner, c, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          cat docs/release-footer.md >> notes.md
      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "clyops $VERSION" --notes-file notes.md --verify-tag
