name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Spec-level checks: generated files in sync, and the completion scripts
  # driven in real bash, zsh and fish against every implementation.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache-dependency-path: packages/go/go.mod }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish shellcheck
      - run: python3 tools/sync-completions.py --check
      - run: pip install jsonschema && python3 tools/check-schema.py
      - run: shellcheck -S warning packages/bash/clyops.sh packages/bash/examples/demo.sh packages/bash/examples/tasks.sh packages/bash/test/test.sh tools/*.sh
      - run: make build
      - run: make conformance
      - run: make completions

  js:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - { os: macos-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Every npm workspace: clyops (packages/js) and the Node tooling built on it.
      - run: npm ci
      # Builds type-check too, in workspace order so each package sees the types it depends on.
      - run: npm run build --workspaces
      - run: npm test --workspaces
      # The committed single-file CommonJS bundles match the sources.
      - run: node tools/bundle-js.mjs --check
      - run: python3 tools/conformance.py js ts cjs-bundle

  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # macOS ships bash 3.2; clyops needs 4.3+.
      - if: runner.os == 'macOS'
        run: brew install bash && echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - run: bash --version | head -1
      - run: bash packages/bash/test/test.sh
      - run: python3 tools/conformance.py bash

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: packages/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install ruff mypy build
      - run: ruff check src tests examples
      - run: mypy src
      - run: python -m unittest discover -s tests
      - run: python ../../tools/conformance.py python
      - run: python -m build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable]
        include:
          - { os: ubuntu-latest, toolchain: "1.70" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: packages/rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --examples
      - run: python3 ../../tools/conformance.py rust
      - if: matrix.toolchain == 'stable'
        run: cargo package --allow-dirty

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [stable]
        include:
          - { os: ubuntu-latest, go: "1.21" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: packages/go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ matrix.go }}", cache-dependency-path: packages/go/go.mod }
      - if: matrix.go == 'stable'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o build/demo ./examples/demo && go build -o build/tasks ./examples/tasks
      - run: python3 ../../tools/conformance.py go

  ruby:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.1", "3.3", "3.4"]
        include:
          - { os: macos-latest, ruby: "3.4" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: packages/ruby } }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "${{ matrix.ruby }}" }
      - run: ruby -w test/test_clyops.rb
      - run: python3 ../../tools/conformance.py ruby
      - run: gem build clyops.gemspec

  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [17, 21]
        include:
          - { os: macos-latest, java: 21 }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: packages/java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ matrix.java }}", cache: maven }
      - run: mvn -B -q package
      - run: javac -Xlint:all,-serial -Werror -cp target/classes -d target/examples examples/Demo.java examples/Tasks.java
      - run: python3 ../../tools/conformance.py java

  dispatch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: apps/dispatch } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - if: runner.os == 'Linux'
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      # The integration tests drive Unix fixtures; Windows checks that it builds.
      - run: cargo test --locked

  c:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
          - { os: ubuntu-latest, cc: clang, sanitize: true }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !matrix.sanitize }}
        run: make -C packages/c test
      - if: ${{ matrix.sanitize }}
        run: make -C packages/c test CFLAGS="-std=c11 -g -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
      - run: python3 tools/conformance.py c
      - name: CMake build
        run: cmake -S packages/c -B packages/c/cmake-build && cmake --build packages/c/cmake-build && ctest --test-dir packages/c/cmake-build
